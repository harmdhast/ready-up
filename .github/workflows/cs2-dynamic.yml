name: CS2 dynamic check

# The dynamic stages of the CS2 compatibility check (docs/CS2-COMPAT.md): a real CS2 dedicated
# server on a SELF-HOSTED runner boots the freshly built Full bundle and
#
#   selftest : READYUP_SELFTEST_AND_QUIT=1 -> readyup_selftest.txt -> per-plugin results: plugin
#              selftest lines, disabled plugins, and every plugin's schema / game event needs
#              (plugins/<name>/needs.json) confirmed on the running build
#   live     : scripts/livetest (bots only: a simulated match (`simulation: true`, Ready Up adds
#              the bots), a scrim, the fleet link driven by a mock platform on loopback
#              (fleet_livetest.py), a match with pauses + team-left forfeit)
#              -> the `livetest` check of `match` (fleet's goes to `fleet`); exit 2 = no verdict,
#              stays pending; a failure of a LIVETEST_ADVISORY test also stays pending
#
# Each stage updates compat.json (stage selftest, then live), POSTs it to COMPAT_INGEST_URL like
# the static watch does, and commits compat.json + badge.json to the `cs2-build` branch.
#
# Live progress (docs/CS2-COMPAT.md "Run steps"): the run's steps (Build bundle, Update CS2,
# Install bundle, Boot + selftest, Live: match / scrim / fleet / forfeit, Record) are POSTed as they go with
# `compat-report.py step`, so the compatibility page shows the run step by step and never looks
# finished while it is still going; the live test adds its own steps under Live: match / scrim / fleet
# (COMPAT_STEP_EVENTS=1). A failed POST is a warning, never a failure.
#
# Runs on the runner labelled `readyup-live` (set up with `csm ci setup`; docs/CS2-COMPAT.md). The
# CI server is a csm instance (CS2_CI_INSTANCE: the shared CS2 install, the bundle built into a
# layer of the instance's own, everything that touches it run through `csm instance exec`) or a
# CS2 install of its own (CS2_CI_DIR alone). It
# is OFF until the repo variable CS2_DYNAMIC_ENABLED is `true`; with it on and no runner
# registered, the `live` job just waits in the queue. Triggers are push to master (merged code) /
# schedule / workflow_dispatch / workflow_run only: never pull_request (a PR must not run code on
# the runner). The server runs
# with +sv_lan 1 and no GSLT.

on:
  workflow_run:
    workflows: ["CS2 update watch"]
    types: [completed]
  push:
    branches: [master]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE*']
  schedule:
    - cron: '41 3 * * *'  # nightly
  workflow_dispatch:
    inputs:
      livetest:
        description: Also run the bot live tests (match, scrim, fleet, forfeit) after the selftest
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: cs2-dynamic
  cancel-in-progress: false

jobs:
  gate:
    name: Decide
    # workflow_run: only after a watch run on the default branch that recorded a new, non-failing
    # static verdict (the watch also succeeds on every no-change poll).
    if: >-
      vars.CS2_DYNAMIC_ENABLED == 'true' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == github.event.repository.default_branch))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
      trigger: ${{ steps.decide.outputs.trigger }}
      started_at: ${{ steps.decide.outputs.started_at }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/ci
            gamedata

      - name: New static verdict?
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          WATCH_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          case "$EVENT" in
            schedule) echo "trigger=nightly" >> "$GITHUB_OUTPUT"; echo "run=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
            workflow_dispatch) echo "trigger=manual" >> "$GITHUB_OUTPUT"; echo "run=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
            push) echo "trigger=code_change" >> "$GITHUB_OUTPUT"; echo "run=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          echo "trigger=build_change" >> "$GITHUB_OUTPUT"
          run=false
          if git fetch -q --depth=1 origin refs/heads/cs2-build && git show FETCH_HEAD:compat.json > compat.json 2>/dev/null; then
            read -r id stage overall < <(python3 -c 'import json; d=json.load(open("compat.json")); print(d["run"]["id"], d["run"]["stage"], d["overall"])')
            echo "cs2-build compat.json: run $id, stage $stage, overall $overall (watch run $WATCH_RUN_ID)"
            if [ "$id" = "$WATCH_RUN_ID" ] && [ "$stage" = static ] && [ "$overall" != fail ]; then run=true; fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "dynamic stage: run=$run" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: 'Progress: the planned steps (Build bundle running)'
        if: steps.decide.outputs.run == 'true'
        continue-on-error: true
        env:
          COMPAT_INGEST_URL: ${{ vars.COMPAT_INGEST_URL }}
          COMPAT_INGEST_TOKEN: ${{ secrets.COMPAT_INGEST_TOKEN }}
          TRIGGER: ${{ steps.decide.outputs.trigger }}
          STARTED_AT: ${{ steps.decide.outputs.started_at }}
        run: |
          # The static verdict gives the CS2 build and the components shown until the selftest.
          [ -f compat.json ] || { git fetch -q --depth=1 origin refs/heads/cs2-build && git show FETCH_HEAD:compat.json > compat.json; } || rm -f compat.json
          python3 scripts/ci/compat-report.py step --base compat.json --trigger "$TRIGGER" --started-at "$STARTED_AT" \
            --plan dynamic --id build --status running || true

  build:
    name: Build the Full bundle (sniper)
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container:
      image: registry.gitlab.steamos.cloud/steamrt/sniper/sdk:latest
    env:
      DEPS_PREFIX: ${{ github.workspace }}/.ci/deps
      DEPS_WORK: ${{ github.workspace }}/.ci/deps-work
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: version
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          echo "version=$(tr -d ' \t\r\n' < VERSION)-dev.$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache static deps (OpenSSL, libcurl)
        uses: actions/cache@v4
        with:
          path: .ci/deps
          key: sniper-static-deps-${{ hashFiles('scripts/ci/build-static-deps.sh') }}

      - name: Build + package
        run: |
          scripts/ci/build-release.sh build-sniper
          scripts/package-release.sh build-sniper "${{ steps.version.outputs.version }}" dist

      - uses: actions/upload-artifact@v4
        with:
          name: cs2-dynamic-dist-${{ github.run_id }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  build-progress:
    name: 'Progress: Build bundle'
    needs: [gate, build]
    if: always() && needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    env:
      COMPAT_INGEST_URL: ${{ vars.COMPAT_INGEST_URL }}
      COMPAT_INGEST_TOKEN: ${{ secrets.COMPAT_INGEST_TOKEN }}
      TRIGGER: ${{ needs.gate.outputs.trigger }}
      STARTED_AT: ${{ needs.gate.outputs.started_at }}
      BUILD_RESULT: ${{ needs.build.result }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/ci
            gamedata

      - name: Report the build
        run: |
          [ -n "$COMPAT_INGEST_URL" ] || exit 0
          { git fetch -q --depth=1 origin refs/heads/cs2-build && git show FETCH_HEAD:compat.json > compat.json; } || rm -f compat.json
          run=(python3 scripts/ci/compat-report.py step --base compat.json --trigger "$TRIGGER" --started-at "$STARTED_AT")
          if [ "$BUILD_RESULT" = success ]; then
            "${run[@]}" --id build --status pass || true
          else
            # The live job never runs: the build failed or was cancelled, and the run ends here.
            "${run[@]}" --plan dynamic --id build --status fail --detail "build job: $BUILD_RESULT" \
              --close --final-state no_verdict || true
          fi

  live:
    name: Selftest + bot live test on a real CS2 server
    needs: [gate, build]
    if: needs.gate.outputs.run == 'true'
    runs-on: [self-hosted, readyup-live]
    # Protected environment (docs/CS2-COMPAT.md): deployments only from the default branch.
    environment: cs2-dynamic
    timeout-minutes: 90
    permissions:
      contents: write  # compat.json + badge.json -> cs2-build
    env:
      TRIGGER: ${{ needs.gate.outputs.trigger }}
      STARTED_AT: ${{ needs.gate.outputs.started_at }}
      COMPAT_INGEST_URL: ${{ vars.COMPAT_INGEST_URL }}
      COMPAT_INGEST_TOKEN: ${{ secrets.COMPAT_INGEST_TOKEN }}
      LIVETEST: ${{ github.event_name != 'workflow_dispatch' || inputs.livetest }}
      # Live tests whose failure only keeps their check pending (not required yet). A new one stays
      # here until it has passed 3 runs in a row; repo variable CS2_LIVETEST_ADVISORY overrides
      # the list (`none` = every live test required).
      LIVETEST_ADVISORY: ${{ vars.CS2_LIVETEST_ADVISORY || 'fleet forfeit' }}
    steps:
      - name: Runner settings (CS2_CI_DIR, CS2_CI_PORT, CS2_CI_INSTANCE from `csm ci setup`)
        run: |
          # csm ci setup writes them into the runner's .env; see docs/CS2-COMPAT.md.
          if [ -z "${CS2_CI_DIR:-}" ] || [ -z "${CS2_CI_PORT:-}" ]; then
            echo "::error::CS2_CI_DIR and CS2_CI_PORT must be set in the runner's .env (csm ci setup does this; manual setup: docs/CS2-COMPAT.md)"
            exit 1
          fi
          case "$CS2_CI_PORT" in ''|*[!0-9]*) echo "::error::CS2_CI_PORT=$CS2_CI_PORT is not a port"; exit 1 ;; esac
          OUT="$RUNNER_TEMP/cs2-dynamic"
          echo "OUT=$OUT" >> "$GITHUB_ENV"
          # CI_EXEC runs a command where the CI install is visible: on a csm instance inside
          # `csm instance exec N` (its view exists only there), else as is. CI_CSM is csm.
          ci_exec=()
          if [ -n "${CS2_CI_INSTANCE:-}" ]; then
            case "$CS2_CI_INSTANCE" in *[!0-9]*) echo "::error::CS2_CI_INSTANCE=$CS2_CI_INSTANCE is not an instance number"; exit 1 ;; esac
            csm="${CS2_CI_CSM:-csm}"
            if ! command -v "$csm" >/dev/null; then
              echo "::error::csm ($csm) not found: CS2_CI_CSM in the runner's .env names it (csm ci setup --instance N writes it)"
              exit 1
            fi
            ci_exec=("$csm" instance exec "$CS2_CI_INSTANCE" --)
            {
              echo "CI_CSM=$csm"
              echo "CI_EXEC=${ci_exec[*]}"
              # The CI server (and the live tests) at a lower CPU priority than the host's servers.
              echo "CSM_INSTANCE_NICE=10"
            } >> "$GITHUB_ENV"
            echo "CS2 instance $CS2_CI_INSTANCE (view $CS2_CI_DIR), port $CS2_CI_PORT, csm $csm"
          else
            echo "CI_EXEC=" >> "$GITHUB_ENV"
          fi
          if ! "${ci_exec[@]}" test -d "$CS2_CI_DIR/game/csgo"; then
            echo "::error::CS2_CI_DIR=$CS2_CI_DIR has no game/csgo (not a CS2 dedicated server install)"
            exit 1
          fi
          if ! "${ci_exec[@]}" test -x "$CS2_CI_DIR/game/cs2.sh"; then
            echo "::error::$CS2_CI_DIR/game/cs2.sh is missing (the server is started through Valve's launcher, as csm does)"
            exit 1
          fi
          # compat-report.py step (and scripts/livetest with COMPAT_STEP_EVENTS=1) read these;
          # current.json is always the last compat.json of this run.
          {
            echo "COMPAT_STEP_STATE=$OUT/steps.json"
            echo "COMPAT_STEP_BASE=$OUT/current.json"
            echo "COMPAT_STEP_BUILD_ENV=$OUT/cs2-build.env"
          } >> "$GITHUB_ENV"
          rm -rf "$OUT" && mkdir -p "$OUT"
          echo "CS2 install $CS2_CI_DIR, port $CS2_CI_PORT"

      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: cs2-dynamic-dist-${{ github.run_id }}
          path: ${{ runner.temp }}/cs2-dynamic/dist

      - name: 'Progress: Update CS2 running'
        run: |
          # The static verdict (cs2-build) is the base until this run has one of its own.
          if ! { git fetch -q --depth=1 origin refs/heads/cs2-build && git show FETCH_HEAD:compat.json > "$OUT/static.json"; }; then
            rm -f "$OUT/static.json"
          fi
          [ -f "$OUT/static.json" ] && cp "$OUT/static.json" "$OUT/current.json"
          s=(python3 scripts/ci/compat-report.py step --trigger "$TRIGGER" --started-at "$STARTED_AT")
          # the build job passed (this job needs it); keep the times the build-progress job sent
          "${s[@]}" --plan dynamic --id build --status pass --no-time --no-post || true
          "${s[@]}" --id update --status running || true

      - name: Update CS2 (steamcmd, anonymous; a delta when current)
        run: |
          if [ -n "$CI_EXEC" ]; then
            # A csm instance runs csm's shared CS2 game version: csm updates it for every
            # instance (csm monitor, csm instance update-game), never this job.
            echo "::notice::CS2 is csm's shared game version of instance $CS2_CI_INSTANCE; csm keeps it updated"
            acf="$($CI_EXEC cat "$CS2_CI_DIR/steamapps/appmanifest_730.acf" 2>/dev/null || true)"
            inf="$($CI_EXEC cat "$CS2_CI_DIR/game/csgo/steam.inf" 2>/dev/null || true)"
            buildid="$(printf '%s\n' "$acf" | sed -n 's/.*"buildid"[[:space:]]*"\([0-9]*\)".*/\1/p' | head -1)"
            patch="$(printf '%s\n' "$inf" | sed -n 's/^PatchVersion=//p' | tr -d '\r' | head -1)"
            printf 'BUILDID=%s\nPATCH_VERSION=%s\n' "$buildid" "$patch" > "$OUT/cs2-build.env"
            if [ -f "$OUT/static.json" ]; then
              want="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("cs2", {}).get("buildid", ""))' "$OUT/static.json" 2>/dev/null || true)"
              if [ -n "$want" ] && [ -n "$buildid" ] && [ "$want" != "$buildid" ]; then
                echo "::warning::the static verdict is for CS2 build $want, the instance runs $buildid (csm has not updated its game version yet)"
              fi
            fi
            echo "CS2 build ${buildid:-?} (patch ${patch:-?})" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          steamcmd="$(command -v steamcmd || true)"
          [ -n "$steamcmd" ] || for c in "$HOME/steamcmd/steamcmd.sh" "$HOME/.steam/steamcmd/steamcmd.sh" /usr/games/steamcmd; do
            [ -x "$c" ] && steamcmd="$c" && break
          done
          if [ -n "$steamcmd" ]; then
            "$steamcmd" +force_install_dir "$CS2_CI_DIR" +login anonymous +app_update 730 +quit
          else
            echo "::notice::steamcmd not found; relying on csm to keep $CS2_CI_DIR up to date"
          fi
          buildid="$(sed -n 's/.*"buildid"[[:space:]]*"\([0-9]*\)".*/\1/p' "$CS2_CI_DIR/steamapps/appmanifest_730.acf" 2>/dev/null | head -1)"
          patch="$(sed -n 's/^PatchVersion=//p' "$CS2_CI_DIR/game/csgo/steam.inf" | tr -d '\r' | head -1)"
          printf 'BUILDID=%s\nPATCH_VERSION=%s\n' "$buildid" "$patch" > "$OUT/cs2-build.env"
          echo "CS2 build ${buildid:-?} (patch ${patch:-?})" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: 'Progress: Update CS2 passed, Install bundle running'
        run: |
          # No static verdict to start from: the components are "checking" until the selftest.
          if [ ! -f "$OUT/current.json" ]; then
            python3 scripts/ci/compat-report.py phase checking --stage selftest --out "$OUT/current.json" \
              --build-env "$OUT/cs2-build.env" --trigger "$TRIGGER" --started-at "$STARTED_AT"
          fi
          python3 scripts/ci/compat-report.py step --updates '[{"id":"update","status":"pass"},{"id":"install","status":"running"}]' || true

      - name: Install the Full bundle
        run: |
          zip="$(find "$OUT/dist" -name 'ready-up-full-*-linuxsteamrt64.zip' | head -1)"
          if [ -n "$CI_EXEC" ]; then
            # The instance starts empty (reset: nothing from the last run) on a layer of its own
            # with this bundle: layers/current and the host's other instances never see it, and
            # the last run's layer is removed.
            "$CI_CSM" instance reset "$CS2_CI_INSTANCE"
            "$CI_CSM" instance layer build --for "$CS2_CI_INSTANCE" --zip "$zip" --installer install.sh \
              --bundle full --accept-license noncommercial
          else
            bash install.sh --dir "$CS2_CI_DIR" --zip "$zip" --yes --accept-license=noncommercial full
          fi
          python3 scripts/ci/compat-report.py step --updates '[{"id":"install","status":"pass"},{"id":"selftest","status":"running"}]' || true

      - name: 'Stage selftest: boot, READYUP_SELFTEST_AND_QUIT'
        id: selftest
        run: |
          set +e
          # Start through Valve's game/cs2.sh, as csm does for every server: it sets up
          # the library path (the real libserver.so needs libv8.so) and the rest of
          # the runtime environment. Running the cs2 binary directly skips that.
          # sv_hibernate_when_empty 0: an empty server stops simulating, so the selftest
          # (which waits for a simulating GameFrame) and plugin loading never happen.
          # +log on: the game log lines (players, bots, rounds) Ready Up and the live test read;
          # csm's server.cfg turns it on for every real server.
          # -allow_round_backup_files: since the October 2026 update CS2 writes round backups only
          # with it (csm adds it since v1.27.4); without it the selftest's round backup check warns.
          # The console streams into this log as it happens (line buffered) and into a file.
          # $CI_EXEC: on a csm instance, in its view (csm instance exec).
          READYUP_SELFTEST_AND_QUIT=1 READYUP_SELFTEST_FILE="$OUT/readyup_selftest.txt" READYUP_SELFTEST_TIMEOUT=300 \
            stdbuf -oL -eL timeout 900 $CI_EXEC "$CS2_CI_DIR/game/cs2.sh" -dedicated -console -usercon -allow_round_backup_files -port "$CS2_CI_PORT" \
            +sv_lan 1 +sv_hibernate_when_empty 0 +log on +game_type 0 +game_mode 1 +map de_dust2 2>&1 \
            | stdbuf -oL tee "$OUT/selftest-console.log"
          rc=${PIPESTATUS[0]}
          echo "server exit code $rc"
          set -e
          if [ -s "$OUT/readyup_selftest.txt" ]; then
            cat "$OUT/readyup_selftest.txt"
            { echo '```'; cat "$OUT/readyup_selftest.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            python3 scripts/ci/compat-report.py annotate-selftest "$OUT/readyup_selftest.txt"
          else
            echo "::error title=selftest::no readyup_selftest.txt: the server did not finish booting with Ready Up (exit $rc)"
          fi
          args=()
          [ -f "$OUT/static.json" ] && args+=(--base "$OUT/static.json")
          python3 scripts/ci/compat-report.py dynamic --stage selftest "${args[@]}" \
            --selftest "$OUT/readyup_selftest.txt" --build-env "$OUT/cs2-build.env" --out-dir "$OUT/selftest" \
            --trigger "$TRIGGER" --started-at "$STARTED_AT"
          python3 scripts/ci/compat-report.py post "$OUT/selftest/compat.json"
          cp "$OUT/selftest/compat.json" "$OUT/current.json"
          overall="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["overall"])' "$OUT/selftest/compat.json")"
          echo "overall=$overall" >> "$GITHUB_OUTPUT"
          if [ "$overall" = fail ]; then
            python3 scripts/ci/compat-report.py step --id selftest --status fail --detail "selftest verdict: fail (see the components)" || true
          else
            python3 scripts/ci/compat-report.py step --id selftest --status pass || true
          fi

      - name: 'Stage live: bot match, scrim, fleet, forfeit (scripts/livetest)'
        id: live
        if: env.LIVETEST == 'true' && steps.selftest.outputs.overall != 'fail'
        run: |
          # scripts/ci/cs2-live-stage.sh runs the four live tests on one CI server (a tmux server
          # of its own, in $OUT/tmux); on a csm instance all of it inside `csm instance exec`.
          echo "started=1" >> "$GITHUB_OUTPUT"
          # (csm instance exec starts in the instance's view: the script by its full path)
          $CI_EXEC bash "$GITHUB_WORKSPACE/scripts/ci/cs2-live-stage.sh"
          results=()
          while IFS= read -r r; do
            [ -n "$r" ] && results+=(--livetest "$r")
          done < "$OUT/live-results.txt"
          python3 scripts/ci/compat-report.py dynamic --stage live --base "$OUT/selftest/compat.json" \
            --selftest "$OUT/readyup_selftest.txt" --build-env "$OUT/cs2-build.env" --out-dir "$OUT/live" \
            --trigger "$TRIGGER" --started-at "$STARTED_AT" "${results[@]}" --livetest-advisory "$LIVETEST_ADVISORY"
          python3 scripts/ci/compat-report.py post "$OUT/live/compat.json"
          cp "$OUT/live/compat.json" "$OUT/current.json"

      - name: 'Progress: live test skipped'
        if: steps.live.outcome == 'skipped'
        env:
          WHY: ${{ env.LIVETEST != 'true' && 'live test not requested' || 'selftest failed' }}
        run: |
          python3 scripts/ci/compat-report.py step --updates "$(python3 -c 'import json,os; print(json.dumps([{"id": i, "status": "skip", "detail": os.environ["WHY"]} for i in ("live-match", "live-scrim", "live-fleet", "live-forfeit")]))')" || true

      - name: Record compat.json + badge.json on cs2-build
        run: |
          python3 scripts/ci/compat-report.py step --id record --status running || true
          d="$OUT/live"
          [ -f "$d/compat.json" ] || d="$OUT/selftest"
          stage="$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print(d["run"]["stage"], d["overall"], d["cs2"]["buildid"])' "$d/compat.json")"
          for _ in 1 2 3; do
            if CS2_STATE_FILES="$d/compat.json $d/badge.json" scripts/ci/cs2-watch-state.sh publish "CS2 dynamic check: $stage"; then
              python3 scripts/ci/compat-report.py step --id record --status pass || true
              exit 0
            fi
            sleep 10
          done
          python3 scripts/ci/compat-report.py step --id record --status fail --detail "could not push compat.json to cs2-build" || true
          exit 1

      - name: Stop the live-test server
        if: always() && steps.live.outputs.started != ''
        run: |
          # The live stage's own tmux server (cs2-live-stage.sh kills it; this is for a cancelled
          # or timed-out run). Inside a csm instance it runs as uid 0, hence tmux-*.
          for sock in "$OUT"/tmux/tmux-*/default; do
            [ -S "$sock" ] && tmux -S "$sock" kill-server 2>/dev/null || true
          done

      - name: 'Progress event: no_verdict'
        if: failure() && steps.selftest.outputs.overall == ''
        continue-on-error: true
        run: |
          python3 scripts/ci/compat-report.py phase no_verdict --stage selftest --out "$OUT/no-verdict.json" \
            --build-env "$OUT/cs2-build.env" --trigger "$TRIGGER" --started-at "$STARTED_AT"
          python3 scripts/ci/compat-report.py post "$OUT/no-verdict.json"
          cp "$OUT/no-verdict.json" "$OUT/current.json"

      - name: 'Progress: close the steps + summary'
        if: always()
        continue-on-error: true
        run: |
          # Anything still running failed (or was cancelled), anything queued never ran. Posts only
          # when that changed something; the table of steps goes to the job summary either way.
          [ -n "${OUT:-}" ] || exit 0
          python3 scripts/ci/compat-report.py step --close --summary || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cs2-dynamic-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/cs2-dynamic/*.txt
            ${{ runner.temp }}/cs2-dynamic/*.log
            ${{ runner.temp }}/cs2-dynamic/*.env
            ${{ runner.temp }}/cs2-dynamic/selftest/
            ${{ runner.temp }}/cs2-dynamic/live/
