name: Build

# Release build of libserver.so + plugins in Valve's Steam Runtime 3 "sniper" SDK (glibc 2.31,
# what CS2 targets), verified against the CURRENT public CS2 build (sigcheck + hook-site check,
# base gamedata + every fragment). Every run uploads the install zips as workflow artifacts:
# ready-up-{core,match,fleet,practice,essentials-plugin,skins,hello,midas,whitelist,deathmatch,addons}-<version>-linuxsteamrt64.zip
# (components), ready-up-{essentials,full}-<version>-linuxsteamrt64.zip (bundles) + SHA256SUMS.
# The installer job then tests install.sh against those zips. Tags v* additionally publish a
# GitHub release with the same files: vX.Y.Z is marked latest, vX.Y.Z-beta.N / -rc.N are
# published as pre-releases (never latest; install.sh --channel beta picks them up).

on:
  push:
    branches: [master, main, 'dev/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Build (sniper) + verify vs current CS2
    runs-on: ubuntu-latest
    container:
      image: registry.gitlab.steamos.cloud/steamrt/sniper/sdk:latest
    env:
      DEPS_PREFIX: ${{ github.workspace }}/.ci/deps
      DEPS_WORK: ${{ github.workspace }}/.ci/deps-work
      DD_DIR: ${{ github.workspace }}/.ci/depotdownloader
      CS2_DIR: ${{ github.workspace }}/.ci/cs2
    outputs:
      version: ${{ steps.version.outputs.version }}
      buildid: ${{ steps.cs2.outputs.buildid }}
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: version
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          file_version="$(tr -d ' \t\r\n' < VERSION)"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
            # Stable X.Y.Z or a pre-release X.Y.Z-beta.N / X.Y.Z-rc.N (release.sh, docs/RELEASING.md),
            # optionally with a fork build suffix .custom.N (-custom.N on a stable X.Y.Z) (FORK.md).
            if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-((beta|rc)\.[1-9][0-9]*(\.custom\.[1-9][0-9]*)?|custom\.[1-9][0-9]*))?$'; then
              echo "::error::tag $GITHUB_REF_NAME is not vX.Y.Z[-beta.N|-rc.N][.custom.N] or vX.Y.Z-custom.N"
              exit 1
            fi
            # The tag is the version: a release is just a tag on master (no VERSION bump PR).
            # The build (CMakeLists.txt, package-release.sh) reads VERSION, so it is written here.
            if [ "$version" != "$file_version" ]; then
              echo "VERSION says $file_version; building $version from the tag"
              printf '%s\n' "$version" > VERSION
            fi
          else
            version="${file_version}-dev.$(git rev-parse --short HEAD)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"
          # License coverage is by version line: the release date of this version's x.y.0
          # (core/src/readyup/license.h). A tag x.y.z (or x.y.z-beta.N) takes the date of tag
          # vx.y.0; the first x.y.0 build, its pre-releases, and dev builds use today.
          line_date=""
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            zero="v$(echo "$version" | cut -d. -f1-2).0"
            if git fetch --depth=1 --no-tags origin "refs/tags/$zero:refs/tags/$zero" 2>/dev/null; then
              line_date="$(git for-each-ref --format='%(creatordate:short)' "refs/tags/$zero")"
            fi
          fi
          [ -n "$line_date" ] || line_date="$(date -u +%F)"
          echo "READYUP_LINE_DATE=$line_date" >> "$GITHUB_ENV"
          echo "License line date: $line_date"

      - name: Unit tests (patch_gameinfo.py, compat-report.py)
        run: python3 -m unittest discover -s tests -v

      - name: Plugin needs manifests match the source (plugins/*/needs.json)
        run: python3 scripts/ci/compat-report.py needs-check

      - name: Cache static deps (OpenSSL, libcurl)
        uses: actions/cache@v4
        with:
          path: .ci/deps
          key: sniper-static-deps-${{ hashFiles('scripts/ci/build-static-deps.sh') }}

      # Compiled objects from earlier runs (scripts/ci/build-release.sh uses ccache when present).
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .ci/ccache
          key: ccache-sniper-${{ github.sha }}
          restore-keys: ccache-sniper-

      - name: Build libserver.so + plugins + tools
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ci/ccache
          CCACHE_MAXSIZE: 500M
          CCACHE_BASEDIR: ${{ github.workspace }}
        run: scripts/ci/build-release.sh build-sniper

      - name: Plugin host test (ctest)
        run: cd build-sniper && ctest --output-on-failure -j"$(nproc)"

      - name: Current CS2 buildid
        id: cs2
        run: echo "buildid=$(scripts/ci/cs2-buildid.sh)" >> "$GITHUB_OUTPUT"

      - name: Cache CS2 binaries for this buildid
        id: cs2-cache
        uses: actions/cache@v4
        with:
          path: .ci/cs2
          key: cs2-linux-bins-${{ steps.cs2.outputs.buildid }}

      - name: Fetch CS2 binaries (DepotDownloader, anonymous, 5 files)
        if: steps.cs2-cache.outputs.cache-hit != 'true'
        run: scripts/ci/fetch-cs2-binaries.sh "$CS2_DIR"

      - name: sigcheck + hookcheck vs current CS2
        run: |
          set +e
          scripts/ci/verify-cs2.sh "$CS2_DIR" build-sniper .ci/report.md
          rc=$?
          cat .ci/report.md >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      - name: Package (component zips + bundles + SHA256SUMS)
        run: |
          . "$CS2_DIR/cs2-build.env"
          CS2_BUILDID="$BUILDID" CS2_PATCH_VERSION="$PATCH_VERSION" \
            scripts/package-release.sh build-sniper "${{ steps.version.outputs.version }}" dist
          mkdir -p dist-info
          cp "$CS2_DIR/cs2-build.env" .ci/report.md dist-info/

      - name: Check bundles (essentials has match + fleet + practice + essentials and no skins; core has neither)
        run: scripts/ci/check-bundles.sh dist "${{ steps.version.outputs.version }}"

      # One artifact with everything (what the installer job and the release use), plus one
      # per zip so a single zip can be downloaded from the run page. Artifacts only: no
      # release is created here.
      - name: Upload artifact (all zips)
        uses: actions/upload-artifact@v4
        with:
          name: ready-up-${{ steps.version.outputs.version }}-linuxsteamrt64
          path: |
            dist/
            dist-info/
          if-no-files-found: error
          retention-days: 30

      - name: Upload ready-up-essentials
        uses: actions/upload-artifact@v4
        with:
          name: ready-up-essentials-${{ steps.version.outputs.version }}
          path: dist/ready-up-essentials-${{ steps.version.outputs.version }}-linuxsteamrt64.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload ready-up-full
        uses: actions/upload-artifact@v4
        with:
          name: ready-up-full-${{ steps.version.outputs.version }}
          path: dist/ready-up-full-*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload ready-up-core
        uses: actions/upload-artifact@v4
        with:
          name: ready-up-core-${{ steps.version.outputs.version }}
          path: dist/ready-up-core-*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload ready-up-match
        uses: actions/upload-artifact@v4
        with:
          name: ready-up-match-${{ steps.version.outputs.version }}
          path: dist/ready-up-match-*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload ready-up-fleet
        uses: actions/upload-artifact@v4
        with:
          name: ready-up-fleet-${{ steps.version.outputs.version }}
          path: dist/ready-up-fleet-*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload ready-up-skins
        uses: actions/upload-artifact@v4
        with:
          name: ready-up-skins-${{ steps.version.outputs.version }}
          path: dist/ready-up-skins-*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload ready-up-practice
        uses: actions/upload-artifact@v4
        with:
          name: ready-up-practice-${{ steps.version.outputs.version }}
          path: dist/ready-up-practice-*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload ready-up-essentials-plugin
        uses: actions/upload-artifact@v4
        with:
          name: ready-up-essentials-plugin-${{ steps.version.outputs.version }}
          path: dist/ready-up-essentials-plugin-*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload ready-up-hello
        uses: actions/upload-artifact@v4
        with:
          name: ready-up-hello-${{ steps.version.outputs.version }}
          path: dist/ready-up-hello-*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload ready-up-midas
        uses: actions/upload-artifact@v4
        with:
          name: ready-up-midas-${{ steps.version.outputs.version }}
          path: dist/ready-up-midas-*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload ready-up-whitelist
        uses: actions/upload-artifact@v4
        with:
          name: ready-up-whitelist-${{ steps.version.outputs.version }}
          path: dist/ready-up-whitelist-*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload ready-up-deathmatch
        uses: actions/upload-artifact@v4
        with:
          name: ready-up-deathmatch-${{ steps.version.outputs.version }}
          path: dist/ready-up-deathmatch-*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload ready-up-addons
        uses: actions/upload-artifact@v4
        with:
          name: ready-up-addons-${{ steps.version.outputs.version }}
          path: dist/ready-up-addons-*.zip
          if-no-files-found: error
          retention-days: 30

  installer:
    name: Installer (install.sh vs the built zips)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ready-up-${{ needs.build.outputs.version }}-linuxsteamrt64
          path: artifact

      - name: shellcheck
        run: shellcheck install.sh release.sh discord-webhook.sh scripts/package-release.sh scripts/ci/check-bundles.sh scripts/ci/release-notes.sh tests/installer/test_install.sh

      - name: release notes from the built zips
        run: |
          scripts/ci/release-notes.sh "v${{ needs.build.outputs.version }}" artifact/dist-info/cs2-build.env artifact/dist > notes.md
          cat notes.md >> "$GITHUB_STEP_SUMMARY"
          for z in artifact/dist/ready-up-*.zip; do
            grep -qF "$(basename "$z")" notes.md || { echo "::error::notes miss $(basename "$z")"; exit 1; }
          done

      - name: install.sh end-to-end (fake server trees, Metamod, rerun, pickers, release mode, beta channel, uninstall)
        run: tests/installer/test_install.sh artifact/dist

  release:
    name: GitHub release
    needs: [build, installer]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: ready-up-${{ needs.build.outputs.version }}-linuxsteamrt64
          path: artifact

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          files=(artifact/dist/ready-up-*-"${VERSION}"-linuxsteamrt64.zip artifact/dist/SHA256SUMS)
          scripts/ci/release-notes.sh "$TAG" artifact/dist-info/cs2-build.env artifact/dist > notes.md
          # A version with a suffix (0.1.0-beta.1, 0.1.0-rc.1) is a pre-release: never "latest",
          # so install.sh's default and anything reading releases/latest keep the last stable one.
          case "$VERSION" in
            *-*) kind=(--prerelease) edit_kind=(--prerelease) ;;
            *) kind=(--latest) edit_kind=(--prerelease=false --latest) ;;
          esac
          echo "Release $TAG: ${kind[*]}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
            gh release edit "$TAG" --notes-file notes.md "${edit_kind[@]}"
          else
            gh release create "$TAG" "${files[@]}" \
              --title "Ready Up $TAG" --notes-file notes.md --verify-tag "${kind[@]}"
          fi

      - name: Announce on Discord
        if: env.DISCORD_WEBHOOK_URL != ''
        run: ./discord-webhook.sh "${{ needs.build.outputs.version }}" || echo "::warning::Discord announcement failed"
