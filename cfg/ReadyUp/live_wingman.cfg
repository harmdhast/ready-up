// Ready Up wingman live baseline (match config `wingman: true`): ReadyUp/live.cfg with the
// 2v2 values of CS2's wingman mode (MR8, $8000 max money, wingman round money, 1:30 rounds,
// 10 s freeze time, MR2 overtime). Go-live execs it instead of live.cfg, also with
// ru_cfg_exec_enable 0; match cvars still win (they go out after it).

ammo_grenade_limit_default 1
ammo_grenade_limit_flashbang 2
ammo_grenade_limit_total 4
cash_player_bomb_defused 300
cash_player_bomb_planted 300
